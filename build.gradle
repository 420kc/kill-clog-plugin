plugins {
    id 'java'
    id 'checkstyle'
}

repositories {
    mavenLocal()
    maven { url = 'https://repo.runelite.net' }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    if (file('../420kcp/build/libs/420-kc-plugin-1.0.0.jar').exists()) {
        testImplementation files('../420kcp/build/libs/420-kc-plugin-1.0.0.jar')
    }
    if (file('../claudescape/build/libs/claudescape-1.0.0.jar').exists()) {
        testImplementation files('../claudescape/build/libs/claudescape-1.0.0.jar')
    }
    testImplementation 'junit:junit:4.13.2'
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'
}

group = 'com.killclog'
version = '1.2.0'
sourceCompatibility = '11'
targetCompatibility = '11'

checkstyle {
    toolVersion = '8.25'
    configDirectory = file("config/checkstyle")
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:deprecation']
}

task run(type: JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.killclog.KillClogPluginTest'
    jvmArgs = ['-ea']
}

// Save current credentials under a name: gradlew saveCreds -Paccount=veci
task saveCreds {
    doLast {
        def name = project.findProperty('account') ?: 'default'
        def rlDir = new File(System.getProperty('user.home'), '.runelite')
        def src = new File(rlDir, 'credentials.properties')
        def dst = new File(rlDir, "credentials-${name}.properties")
        if (!src.exists()) throw new GradleException("No credentials.properties found")
        dst.text = src.text
        println "Saved credentials as '${name}' -> ${dst.name}"
    }
}

// Load saved credentials: gradlew loadCreds -Paccount=veci
task loadCreds {
    doLast {
        def name = project.findProperty('account') ?: 'default'
        def rlDir = new File(System.getProperty('user.home'), '.runelite')
        def src = new File(rlDir, "credentials-${name}.properties")
        def dst = new File(rlDir, 'credentials.properties')
        if (!src.exists()) throw new GradleException("No saved credentials for '${name}'")
        dst.text = src.text
        println "Loaded '${name}' credentials -> credentials.properties"
    }
}
